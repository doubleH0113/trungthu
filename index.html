<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chúc Mừng Trung Thu</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('hinhnentrungthu.png') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      font-family: "Arial", sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin-top: 60px;
      font-size: 2.8em;
      color: #fff;
      text-shadow: 0 0 25px #ffd369, 0 0 40px #ffb347;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 15px #ffd369; }
      to { text-shadow: 0 0 40px #ffb347, 0 0 60px #ffd369; }
    }

    p {
      font-size: 1.4em;
      margin-top: 15px;
      color: #fff;
      text-shadow: 0 0 10px #f08a5d;
    }

    img {
      margin-top: 40px;
      width: 360px;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(255, 211, 105, 0.6);
      transition: transform 0.5s ease;
    }

    img:hover {
      transform: scale(1.05);
    }

    /* Đèn lồng */
    .lantern {
      position: absolute;
      width: 60px;
      height: 80px;
      background: #ff4e50;
      border-radius: 30px;
      box-shadow: 0 0 20px rgba(255, 78, 80, 0.8);
      animation: swing 3s ease-in-out infinite;
    }

    .lantern::before {
      content: "";
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 20px;
      background: #fff;
    }

    .lantern::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 10px;
      background: #f08a5d;
      border-radius: 50%;
    }

    @keyframes swing {
      0% { transform: rotate(5deg); }
      50% { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }

    /* Hạc bay */
    .crane {
      position: absolute;
      top: 60%;
      left: -100px;
      width: 80px;
      height: 80px;
      background: url('https://cdn-icons-png.flaticon.com/512/7430/7430773.png') no-repeat center/contain;
      animation: fly 20s linear infinite;
      opacity: 0.9;
    }

    .crane:nth-child(2) {
      top: 40%;
      animation-delay: 5s;
      transform: scale(0.8);
    }

    .crane:nth-child(3) {
      top: 25%;
      animation-delay: 10s;
      transform: scale(0.6);
    }

    @keyframes fly {
      0% { left: -150px; transform: translateY(0) scale(1); }
      50% { transform: translateY(-50px) scale(1.1); }
      100% { left: 110%; transform: translateY(0) scale(1); }
    }

    /* Nút bật nhạc */
    #playBtn {
      margin-top: 30px;
      padding: 12px 25px;
      font-size: 1.1em;
      border: none;
      border-radius: 25px;
      background: #ffd369;
      color: #222;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 211, 105, 0.8);
      transition: all 0.3s ease;
    }

    #playBtn:hover {
      background: #f08a5d;
      color: #fff;
      box-shadow: 0 0 25px #f08a5d;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>✨ Chúc Mừng Trung Thu ✨</h1>
  <p>Chúc bạn và gia đình một đêm Trung Thu đoàn viên, tràn ngập niềm vui và hạnh phúc 🎑🥮🐇</p>

  <!-- Hình bánh trung thu -->
  <img src="hinhnentrungthu.png" alt="Bánh trung thu và trà">

  <!-- Nhạc nền -->
  <audio id="music" autoplay loop>
    <source src="chiecdensao.mp3" type="audio/mpeg">
  </audio>

  <!-- Nút phát nhạc -->
  <button id="playBtn">🎵 Bật nhạc Trung Thu</button>

  <script>
    const btn = document.getElementById("playBtn");
    const music = document.getElementById("music");

    // Thử phát tự động (nếu trình duyệt cho phép)
    window.addEventListener("load", () => {
      const playPromise = music.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          console.log("Trình duyệt chặn tự động phát, cần người dùng nhấn nút.");
        });
      }
    });

    // Khi người dùng bấm nút → phát nhạc và ẩn nút
    btn.addEventListener("click", () => {
      music.play();
      btn.style.display = "none";
    });
  </script>

  <!-- Đèn lồng (đỏ dời sang trái) -->
  <div class="lantern" style="top: 100px; left: 5%;"></div>
  <div class="lantern" style="top: 250px; left: 60%; background:#ffd369; box-shadow:0 0 20px #ffd369;"></div>
  <div class="lantern" style="top: 150px; left: 80%; background:#00bbf9; box-shadow:0 0 20px #00bbf9;"></div>

  <!-- Hạc bay -->
  <div class="crane"></div>
  <div class="crane"></div>
  <div class="crane"></div>
</body>
</html>
