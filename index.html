<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chúc Mừng Trung Thu</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to top, #1a1a2e, #16213e);
      color: #fff;
      font-family: "Arial", sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin-top: 60px;
      font-size: 2.5em;
      color: #ffd369;
      text-shadow: 0 0 15px #f08a5d, 0 0 25px #f08a5d;
    }

    p {
      font-size: 1.3em;
      margin-top: 20px;
      color: #ffe0ac;
    }

    /* Đèn lồng */
    .lantern {
      position: absolute;
      width: 60px;
      height: 80px;
      background: #ff4e50;
      border-radius: 30px;
      box-shadow: 0 0 20px rgba(255, 78, 80, 0.7);
      animation: swing 3s ease-in-out infinite;
    }

    .lantern::before {
      content: "";
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 20px;
      background: #fff;
    }

    .lantern::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 10px;
      background: #f08a5d;
      border-radius: 50%;
    }

    @keyframes swing {
      0% { transform: rotate(5deg); }
      50% { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }
  </style>
</head>
<body>
  <h1>✨ Chúc Mừng Trung Thu ✨</h1>
  <p>Chúc bạn và gia đình một đêm Trung Thu đoàn viên, tràn ngập niềm vui và hạnh phúc 🎑🥮🐇</p>

   <!-- Hình bánh trung thu -->
  <img src="hinhnentrungthu.png" alt="Bánh trung thu">

  
  <!-- Đèn lồng -->
  <div class="lantern" style="top: 100px; left: 20%;"></div>
  <div class="lantern" style="top: 250px; left: 60%; background:#ffd369; box-shadow:0 0 20px #ffd369;"></div>
  <div class="lantern" style="top: 150px; left: 80%; background:#00bbf9; box-shadow:0 0 20px #00bbf9;"></div>
</body>
</html>
